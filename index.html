<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Private Wealth Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              gold: {
                400: '#FACC15',
                500: '#EAB308',
                600: '#CA8A04',
                700: '#A16207',
              },
              navy: {
                800: '#1e293b', // slate-800
                900: '#0f172a', // slate-900
                950: '#020617', // slate-950
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #000000; /* Deepest black for max contrast */
        color: #e2e8f0;
        margin: 0;
        min-height: 100vh;
      }
      
      /* Base Glass/Light Core */
      .glass-card {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      /* 1. Multi-layer Glow CTA */
      .neon-button {
        background-color: transparent;
        border: 1px solid #00ffcc;
        color: #00ffcc;
        box-shadow: 
          0 0 5px rgba(0,255,204,0.4),
          0 0 15px rgba(0,255,204,0.2),
          0 0 40px rgba(0,255,204,0.1);
        text-shadow: 
          0 0 5px rgba(0,255,204,0.8),
          0 0 10px rgba(0,255,204,0.4);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .neon-button:hover {
        background-color: rgba(0,255,204,0.1);
        box-shadow: 
          0 0 10px #00ffcc,
          0 0 20px rgba(0,255,204,0.6),
          0 0 50px rgba(0,255,204,0.4);
        text-shadow: 
          0 0 8px #fff,
          0 0 15px #00ffcc;
        color: #ffffff;
        border-color: #ffffff;
      }
      .neon-button:active {
        box-shadow: 0 0 5px rgba(0,255,204,0.5);
        text-shadow: none;
        color: #00ffcc;
        background-color: transparent;
        transition: 0.1s;
      }

      /* 2. Spotlight Gradient Card (requires JS var --mouse-x/y) */
      .spotlight-card {
        background: radial-gradient(
          800px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
          rgba(255, 255, 255, 0.06),
          transparent 40%
        ), rgba(15, 23, 42, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.05);
        transition: border-color 0.3s ease;
      }
      .spotlight-card:hover {
        border-color: rgba(255, 255, 255, 0.2);
      }

      /* 3. Frosted Light Panel */
      .glass-light-panel {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid rgba(255, 255, 255, 0.15); /* Top highlight */
        border-left: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.05);
      }

      /* 4. Text Glows */
      .text-glow {
        color: #ffffff;
        text-shadow: 0 0 15px rgba(255,255,255,0.4), 0 0 30px rgba(255,255,255,0.2);
      }
      .text-glow-accent {
        color: #00ffcc;
        text-shadow: 0 0 10px rgba(0,255,204,0.6), 0 0 20px rgba(0,255,204,0.4);
      }

      /* Base Animations */
      @keyframes pulseGlow {
        0% { opacity: 0.4; transform: scale(1); filter: blur(100px); }
        100% { opacity: 0.8; transform: scale(1.05); filter: blur(120px); }
      }
      .pulse-glow {
        animation: pulseGlow 4s ease-in-out infinite alternate;
      }
      .color-dodge {
        mix-blend-mode: color-dodge;
      }
    </style>
    <script type="module" src="/index.tsx"></script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
